<!DOCTYPE html><html><body style="font-family:sans-serif;padding:2rem;text-align:center">
<h2>توليد أيقونات PWA</h2>
<p>اضغط الزر — سيتم تنزيل 3 ملفات. ضعها في مجلد <code>icons/</code>.</p>
<button id="go" style="padding:1rem 2rem;font-size:1.1rem;cursor:pointer;background:#0a6fb0;color:#fff;border:0;border-radius:10px">تنزيل الأيقونات</button>
<hr style="margin:2rem 0">
<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48"><rect width="48" height="48" fill="#0c2233"/><path d="M24 3c3 9 14 13 14 26a14 14 0 0 1-28 0c0-6 3-9 6-12 0 5 3 7 5 7-2-8 0-15 3-21z" fill="#f2a516"/><path d="M24 24c2 4 7 6 7 12a7 7 0 0 1-14 0c0-4 4-6 7-12z" fill="#0a6fb0"/></svg>`;
async function make(size, name, maskable){
  const img = new Image();
  const blob = new Blob([svg], { type:'image/svg+xml' });
  img.src = URL.createObjectURL(blob);
  await img.decode();
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  if (maskable){
    // خلفية كاملة + الشعار في المنتصف بنسبة 80%
    ctx.fillStyle = '#0c2233';
    ctx.fillRect(0, 0, size, size);
    const inner = Math.floor(size * 0.8);
    const off = Math.floor((size - inner) / 2);
    ctx.drawImage(img, off, off, inner, inner);
  } else {
    ctx.drawImage(img, 0, 0, size, size);
  }
  const a = document.createElement('a');
  a.href = c.toDataURL('image/png');
  a.download = name;
  a.click();
}
document.getElementById('go').onclick = async () => {
  await make(192, 'icon-192.png', false);
  await new Promise(r=>setTimeout(r,300));
  await make(512, 'icon-512.png', false);
  await new Promise(r=>setTimeout(r,300));
  await make(512, 'icon-maskable-512.png', true);
};
</script>
</body></html>
